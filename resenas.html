<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseñas | Barbería Clásica</title>
  <meta name="description" content="Lo que dicen nuestros clientes de Barbería Clásica.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Barbería Clásica<span>BARBERSHOP</span></a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="index.html#servicios">Servicios</a>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="resenas.html" class="active">Reseñas</a>
        <a href="index.html#reservar" class="btn">Reservar</a>
      </nav>
      <div class="lang">
        <button class="lang-btn" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-2.9a15.7 15.7 0 00-1.4-3.6A8 8 0 0118.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 010-4h3.4a16.5 16.5 0 000 4H4.3zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 015.1 16zM8 8H5.1a8 8 0 014.3-3.6C8.8 5.5 8.3 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 010-4h4.6a14.7 14.7 0 010 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 01-4.3 3.6zm1.7-5.6a16.5 16.5 0 000-4h3.4a8.2 8.2 0 010 4h-3.4z"/></svg>
          <span>Traducción</span>
        </button>
        <div class="lang-menu" role="menu">
          <button role="menuitem" data-lang="en">English</button>
          <button role="menuitem" data-lang="es">Español</button>
        </div>
      </div>
      <button class="menu-toggle" aria-label="Abrir menú"><span></span><span></span><span></span></button>
    </div>
    <div class="pole"></div>
  </header>

  <section class="page-hero">
    <div class="container reveal">
      <span class="eyebrow">Testimonios</span>
      <h1>Lo que dicen <em>nuestros clientes</em></h1>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="rating-summary reveal">
        <div class="rating-big">
          <strong id="avg">5.0</strong>
          <div class="stars" id="avg-stars">★★★★★</div>
          <small id="count">0 reseñas</small>
        </div>
        <div id="bars"></div>
      </div>

      <div class="reviews-grid" id="reviews-grid"></div>
    </div>
  </section>

  <section class="review-form-wrap">
    <div class="container">
      <div class="booking-box reveal">
        <div class="section-head" style="margin-bottom:44px">
          <span class="eyebrow">Tu opinión</span>
          <h2>Déjanos tu <em>reseña</em></h2>
          <p>¿Nos visitaste? Cuéntanos cómo te fue.</p>
        </div>
        <form id="review-form" class="form-grid">
          <div><label for="r-nombre">Nombre</label><input id="r-nombre" name="nombre" required maxlength="40" placeholder="Tu nombre"></div>
          <div>
            <label>Calificación</label>
            <div class="star-input">
              <input type="radio" id="s5" name="stars" value="5"><label for="s5">★</label>
              <input type="radio" id="s4" name="stars" value="4"><label for="s4">★</label>
              <input type="radio" id="s3" name="stars" value="3"><label for="s3">★</label>
              <input type="radio" id="s2" name="stars" value="2"><label for="s2">★</label>
              <input type="radio" id="s1" name="stars" value="1"><label for="s1">★</label>
            </div>
          </div>
          <div class="full"><label for="r-comentario">Comentario</label><textarea id="r-comentario" name="comentario" required maxlength="300" placeholder="Escribe tu experiencia…"></textarea></div>
          <div class="full form-foot">
            <span class="form-msg" id="form-msg"></span>
            <button type="submit" class="btn">Publicar reseña</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="copyright">© <span data-year></span> Barbería Clásica · <a href="index.html" style="color:var(--gold)">Volver al inicio</a></div>
  </footer>

  <a data-wa class="wa-float" aria-label="Escríbenos por WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.6-.1 1.8-.7 2-1.5.2-.7.2-1.4.2-1.5-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2S21.8 6.6 21.8 12 17.4 21.8 12 21.8zM12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.8 1 3.8 1.5 5.8 1.5 6.6 0 12-5.4 12-12S18.6 0 12 0z"/></svg></a>

  <script src="script.js"></script>
</body>
</html>
